<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Arcade — Browser Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <button type="button" class="logo-btn" id="btn-home" aria-label="Back to home">
      <span class="logo-glow">NEON</span>
      <span class="logo-sub">ARCADE</span>
    </button>
    <div class="header-stats" id="header-stats" hidden>
      <span class="stat" id="stat-score">SCORE <strong>0</strong></span>
      <span class="stat" id="stat-level" hidden>LVL <strong>1</strong></span>
      <span class="stat" id="stat-lives" hidden>LIVES <strong>3</strong></span>
    </div>
  </header>

  <main id="app">
    <!-- HOME -->
    <section id="view-home" class="view active">
      <div class="hero">
        <h1 class="hero-title">
          <span class="line">PLAY.</span>
          <span class="line accent">GLOW.</span>
          <span class="line">WIN.</span>
        </h1>
        <p class="hero-tag">Five instant-play games. No downloads. Pure browser chaos.</p>
      </div>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <!-- GAME VIEWS -->
    <section id="view-game" class="view" hidden>
      <div class="game-panel">
        <div class="game-title-bar">
          <h2 id="game-title">Game</h2>
          <p id="game-hint" class="game-hint"></p>
        </div>
        <div class="canvas-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="game-overlay" class="game-overlay" hidden>
            <div class="overlay-card">
              <h3 id="overlay-title">Ready?</h3>
              <p id="overlay-msg">Press Space or tap to start</p>
              <button type="button" class="btn-neon" id="overlay-btn">PLAY</button>
            </div>
          </div>
        </div>
        <div class="game-controls" id="game-controls"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built for the browser · Arrow keys · WASD · Touch</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
